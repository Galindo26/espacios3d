<text x="50" y="200" font-size="8" text-anchor="middle" dominant-baseline="middle" fill="#2b2f33">Caja</text>
</g>
<g><title>fuera «Caja» 50x50x80 cm</title>
<polygon points="125,125 175,125 175,175 125,175" fill="#9aa3ab" fill-opacity="0.9" stroke="#c0392b" stroke-width="2"/>
