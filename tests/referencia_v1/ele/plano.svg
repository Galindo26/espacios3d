<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 410 410" width="820" height="820" font-family="sans-serif">
<title>Caso ele</title>
<rect x="-55" y="-55" width="410" height="410" fill="#fbfaf7"/>
<polygon points="-15,-15 315,-15 315,115 115,115 115,315 -15,315" fill="#3b4046"/>
<polygon points="0,0 300,0 300,100 100,100 100,300 0,300" fill="#efe8dc"/>
<polygon points="300,10 300,90 315.5,90 315.5,10" fill="#efe8dc"/>
<g><title>a «Caja» 100x60x80 cm</title>
<polygon points="100,20 200,20 200,80 100,80" fill="#9aa3ab" fill-opacity="0.9" stroke="#2b2f33" stroke-width="0.8"/>
